# Mantém o web service gratuito da Render "acordado":
# o plano free suspende a instância após ~15 min sem tráfego e o primeiro
# acesso pode demorar ~40-60 s. Este ping a cada 10 minutos evita a suspensão.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no health check do backend
        run: curl -sf --max-time 150 https://quiz-daniel-api.onrender.com/health || true
